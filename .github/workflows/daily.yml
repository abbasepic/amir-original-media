name: daily-post
# Manual tools only (test, diag, render checks). The daily work is done by bot.yml.
# This workflow does not commit state.json, so it never fights with the running bot.
on:
  workflow_dispatch:
    inputs:
      mode: { description: 'ask | preview | publish | ping | register | test', required: true, default: ping }
      arg: { description: 'extra argument (test number)', required: false, default: '' }
      force: { description: 'ignore the time window', type: boolean, default: false }
  push:
    paths: ['.run']
permissions:
  contents: write
concurrency: manual-tools
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - name: choose mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then M="${{ inputs.mode }}"; A="${{ inputs.arg }}"; F="${{ inputs.force && '1' || '' }}"
          elif [ "${{ github.event_name }}" = "push" ]; then read M A < <(tr '\n' ' ' < .run); F=1
          else case "${{ github.event.schedule }}" in
              "30 8 * * *") M=ask;; "30 13 * * *") M=preview;; "30 14 * * *") M=publish;; esac; F=""; fi
          echo "MODE=$M" >> $GITHUB_ENV; echo "ARG=$A" >> $GITHUB_ENV; echo "FORCE=$F" >> $GITHUB_ENV; echo "mode=$M arg=$A force=$F"
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save sharp@0.34.5 playwright@1.48.2
      - if: contains(fromJSON('["preview","publish","test","now","repost"]'), env.MODE)
        run: timeout 300 npx playwright install --with-deps chromium || npx playwright install chromium
      - run: node pipeline.js "$MODE" $ARG 2>&1 | tee last-run.log; test ${PIPESTATUS[0]} -eq 0
        shell: bash
        env: { RUBIKA_TOKEN: "${{ secrets.RUBIKA_TOKEN }}", TELEGRAM_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}" }
      - if: failure()
        env: { TELEGRAM_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}" }
        run: |
          C=$(node -e "console.log(require('./state.json').owner_tg||'')")
          [ -n "$C" ] && curl -s -o /dev/null --retry 3 "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" --data-urlencode "chat_id=$C" --data-urlencode "text=❌ اجرای «$MODE» روی سرور شکست خورد. گزارش: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - if: always()
        run: |
          git config user.name remota-bot; git config user.email bot@users.noreply.github.com
          git checkout -- template/posts.js state.json 2>/dev/null || true
          git add last-run.log; git diff --cached --quiet && exit 0
          git commit -m "state $(date -u +%F-%H%M) $MODE"
          for i in 1 2 3; do git pull --rebase --autostash -q && git push -q && break; sleep 5; done
